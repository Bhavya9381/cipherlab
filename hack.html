<body>
    <header>
        <h1>CipherLab</h1>
        <nav class="nav_bar" aria-label="Primary navigation">
            <a href="Home.html">Workspace</a>
            <a href="Encryption.html">Encryption</a>
            <a href="Decryption.html">Decryption</a>

    </header>
    <div id="background-image"></div>
    <main>
        <p><b><i>Hacking is not about breaking into systems. <br>It's about understanding how things work</i></b></p>
        
        <form id="decryptForm">
            <label for="encryptedMessage">Enter encrypted message:</label>
            <textarea id="encryptedMessage" name="encryptedMessage" rows="6" maxlength="2000" placeholder="Paste or type encrypted text here..."></textarea>
            <input type="submit" value="Decrypt">
        </form>  

        <div id="decryptedMessages" class="decrypted"></div>

        <div class="checking">
            <form action="Home.html" method="get">
                <input type="submit" value="Open workspace">
            </form>
        </div>
    </main>

            </div>
    </footer>

    <script>
        function decryptMessage(encryptedMessage) {
            const resultsDiv = document.getElementById("decryptedMessages");
            resultsDiv.innerHTML = "<p>Decrypted messages:</p>";
            
            for (let r_key = 1; r_key <= 26; r_key++) {
                let decryptedMessage = "";
                for (let i = 0; i < encryptedMessage.length; i++) {
                    let char = encryptedMessage[i];
                    if (char >= 'a' && char <= 'z') {
                        let r = (char.charCodeAt(0) - 'a'.charCodeAt(0) - r_key + 26) % 26 + 'a'.charCodeAt(0);
                        decryptedMessage += String.fromCharCode(r);
                    } else if (char >= 'A' && char <= 'Z') {
                        let r = (char.charCodeAt(0) - 'A'.charCodeAt(0) - r_key + 26) % 26 + 'A'.charCodeAt(0);
                        decryptedMessage += String.fromCharCode(r);
                    } else {
                        decryptedMessage += char;
                    }
                }
                resultsDiv.innerHTML += `<p>${r_key}: ${decryptedMessage}</p>`;
            }
        }

        document.getElementById("decryptForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const encryptedMessage = document.getElementById("encryptedMessage").value;
            decryptMessage(encryptedMessage);
        });
    </script>
</body>
